server:
  port: 8080

#Essentially, yes—there is zero real-time attempt to call the downstream service. When the circuit breaker is in the Open state,
#it "trips" and immediately blocks any new requests from even trying to reach the destination service.However, the "communication" doesn't just
#disappear. Instead, the circuit breaker handles it in one of these ways:Fast Fail: The calling service gets an immediate error (like a 503 Service
#Unavailable) without waiting for a timeout.Fallback Response: The system can provide a "plan B," such as returning cached data or a default value so
#  the user still sees something useful.The "Wait and See" (Half-Open): The circuit doesn't stay open forever. After a set period (the "sleep window"),
#  it moves to a Half-Open state where it lets just one or a few requests through to see if the other service is healthy again.

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 10MB

  cloud:
    gateway:
      # Never strip Authorization (older SCG defaults listed it as sensitive).
      sensitive-headers: []
      # Cut off slow downstream calls so the client gets the CB fallback quickly
      # instead of waiting for the full upstream (e.g. MySQL connect) to finish.
      httpclient:
        connect-timeout: 3000
        response-timeout: 20s

      # ============ ROUTE DEFINITIONS ============
      routes:

        # ---------- AUTH SERVICE ----------
        # Lower rate limit – brute-force protection (10 req/s, burst 20)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCB
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        # ---------- RESTAURANT SERVICE (Public menu & catalog) ----------
        # Order service + customer UI – no JWT (30 req/s, burst 60)
        - id: restaurant-service-public-api
          uri: ${RESTAURANT_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/public/restaurants/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceCB
                fallbackUri: forward:/fallback/restaurant
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@publicReadRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        # ---------- RESTAURANT SERVICE (Local disk menu images) ----------
        - id: restaurant-service-public-media
          uri: ${RESTAURANT_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/public/media/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceCB
                fallbackUri: forward:/fallback/restaurant
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@publicReadRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        # ---------- RESTAURANT SERVICE (Public GET) ----------
        # Public reads – generous limit (50 req/s, burst 100)
        - id: restaurant-service-public
          uri: ${RESTAURANT_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/restaurants/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceCB
                fallbackUri: forward:/fallback/restaurant
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@publicReadRateLimiter}"
                key-resolver: "#{@ipKeyResolver}"

        # ---------- RESTAURANT SERVICE (Authenticated writes) ----------
        # Secured mutations – per-user limit (30 req/s, burst 60)
        - id: restaurant-service-secured
          uri: ${RESTAURANT_SERVICE_URL:http://127.0.0.1:8082}
          predicates:
            - Path=/api/restaurants/**
            - Method=POST,PUT,PATCH,DELETE
          filters:
            - name: CircuitBreaker
              args:
                name: restaurantServiceCB
                fallbackUri: forward:/fallback/restaurant
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authenticatedRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ---------- ORDER SERVICE ----------
        # Transactional – per-user limit (30 req/s, burst 60)
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://127.0.0.1:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCB
                fallbackUri: forward:/fallback/order
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authenticatedRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ---------- USER SERVICE (profiles & addresses) ----------
        - id: user-service
          uri: ${USER_SERVICE_URL:http://127.0.0.1:8086}
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authenticatedRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ---------- PAYMENT SERVICE ----------
        # High-value endpoints – per-user limit (30 req/s, burst 60)
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://127.0.0.1:8084}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: paymentServiceCB
                fallbackUri: forward:/fallback/payment
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@authenticatedRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

        # ---------- NOTIFICATION SERVICE ----------
        # Internal use – moderate limit (20 req/s, burst 40)
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://127.0.0.1:8085}
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notificationServiceCB
                fallbackUri: forward:/fallback/notification
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@notificationRateLimiter}"
                key-resolver: "#{@userKeyResolver}"

      # Default filters applied to ALL routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # Global CORS
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: Authorization,Content-Type

  # ============ REDIS ============
  # Used by Spring Cloud Gateway's built-in RequestRateLimiter (Token Bucket)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}        # blank = no auth (change in prod)
      timeout: 2000ms                     # command timeout
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 16    # max simultaneous connections
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms  # block at most 1 s before error

# JWT config – MUST match auth-service exactly (same default as auth-service application.yaml)
# Primary rate limits: per-route RequestRateLimiter + Redis (see RateLimiterConfig).
# Do NOT enable in-memory unless Redis is down — it caps ALL routes at 100 req/min per IP.
gateway:
  rate-limit:
    in-memory:
      enabled: false

jwt:
  secret: ${JWT_SECRET:12345678901234567890123456789012}

# ============ RESILIENCE4J CIRCUIT BREAKER ============
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
#        10,000 ms = 10 seconds.
        permittedNumberOfCallsInHalfOpenState: 5
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 10000   # 10s – prevents cold-start requests from being counted as "slow"
    instances:
      authServiceCB:
        baseConfig: default
      restaurantServiceCB:
        baseConfig: default
      orderServiceCB:
        baseConfig: default
      userServiceCB:
        baseConfig: default
      paymentServiceCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default

  timelimiter:
    configs:
      default:
        timeoutDuration: 20s
        cancelRunningFuture: true
    instances:
      authServiceCB:
        baseConfig: default
      restaurantServiceCB:
        baseConfig: default
      orderServiceCB:
        baseConfig: default
      userServiceCB:
        baseConfig: default
      paymentServiceCB:
        baseConfig: default
      notificationServiceCB:
        baseConfig: default

# ============ ACTUATOR ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

# ============ LOGGING ============
logging:
  level:
    com.api_gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.data.redis: WARN