  key-id: ${RAZORPAY_KEY_ID:rzp_test_TE8SLDV1LFUfMb}
  key-secret: ${RAZORPAY_KEY_SECRET:O0ymeEWckc4Axxqx6ol2P21K}
  currency: INR
